<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Tab Recorder</title>
  <style>
    :root {
      color-scheme: light;
      color: #1f2937;
      background: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      min-height: 240px;
      background: #f8fafc;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .popup-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
      color: #111827;
    }

    .title-icon {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      background: transparent;
      color: #4338ca;
      font-size: 22px;
      box-shadow: none;
    }

    .popup-description {
      margin: 0;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
      max-width: 240px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.15);
    }

    .dot.live {
      background: #2563eb;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
    }

    .card {
      padding: 14px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid rgba(31, 41, 55, 0.08);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    #startBtn {
      background: #1d4ed8;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.18);
    }

    #startBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #2563eb;
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.22);
    }

    #stopBtn {
      background: #dc2626;
      box-shadow: 0 10px 20px rgba(248, 113, 113, 0.18);
    }

    #stopBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #ef4444;
      box-shadow: 0 12px 24px rgba(248, 113, 113, 0.22);
    }

    #status {
      font-size: 12px;
      color: #475569;
      min-height: 18px;
      line-height: 1.5;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="popup-header">
    <span class="title-icon">✨</span>
    <h1>Tab Recorder</h1>
    <p class="popup-description">
      Record your active tab and send it instantly to the AI meeting analyzer.
    </p>
  </div>

  <div class="card" style="width:100%;">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" style="display:none;">Stop Recording</button>
    <div id="status">Idle</div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
