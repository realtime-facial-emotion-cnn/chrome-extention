<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meeting Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-dot"></div>
        <span>MeetingLens</span>
      </div>
    </header>

    <p class="info-text">Click below to open the recorder in a full tab. Screen recording works there.</p>

    <button class="btn btn-insights" id="openBtn">
      <span class="btn-icon">✦</span>
      <span>Open Recorder</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
