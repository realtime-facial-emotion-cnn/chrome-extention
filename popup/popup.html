<!DOCTYPE html>
<html>

<head>
    <title>Tab Audio Recorder</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1 class="title">Tab Recorder</h1>

        <div class="section">
            <h2>Audio Recording</h2>
            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">Start Audio</button>
                <!-- <button id="stopBtn" class="btn btn-secondary">Stop Audio</button> -->
            </div>
        </div>

        <div class="section">
            <h2>Video Recording</h2>
            <div class="button-group">
                <button id="startVideoBtn" class="btn btn-primary">Start Video</button>
                <!-- <button id="stopVideoBtn" class="btn btn-secondary">Stop Video</button> -->
            </div>
        </div>

        <div class="section">
            <button id="insightBtn" class="btn btn-insight">Get Insights</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
