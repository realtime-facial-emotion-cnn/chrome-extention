<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MeetingLens</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-dot"></div>
        <span>MeetingLens</span>
      </div>
      <div class="status-badge" id="statusBadge">Ready</div>
    </header>

    <p class="info-text">
      Capture the current tab with your camera and microphone, then stop to send the recording into the app.
    </p>

    <div class="btn-row">
      <button class="btn btn-start" id="startBtn">Start Recording</button>
      <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="divider"></div>

    <div class="track-status">
      <div class="track ready">
        <span class="track-dot"></span>
        <span>Current tab</span>
        <span class="track-state">Ready</span>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span id="statusText">Waiting for action</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
